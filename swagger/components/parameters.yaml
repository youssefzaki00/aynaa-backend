PageParam:
  name: page
  in: query
  schema:
    type: integer
    minimum: 1
    default: 1

LimitParam:
  name: limit
  in: query
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20

SearchParam:
  name: search
  in: query
  schema:
    type: string
  description: Case-insensitive text search

LastSyncParam:
  name: lastSync
  in: query
  schema:
    type: string
    format: date-time
  description: Return items created/updated after this timestamp (incremental sync)

IdPathParam:
  name: id
  in: path
  required: true
  schema:
    type: string
  description: MongoDB document ID

BearerAuth:
  security:
    - bearerAuth: []
