/keywords:
  get:
    tags: [Sync]
    summary: List keywords
    description: Returns enabled keywords. Use `lastSync` for incremental updates.
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/LastSyncParam'
      - $ref: '#/components/parameters/SearchParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
      - name: categoryId
        in: query
        schema:
          type: string
      - name: isEnabled
        in: query
        schema:
          type: boolean
    responses:
      '200':
        description: Keywords retrieved
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccess'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        keywords:
                          type: array
                          items:
                            $ref: '#/components/schemas/Keyword'
                        deletedKeywordIds:
                          type: array
                          items:
                            type: string
                        pagination:
                          $ref: '#/components/schemas/PaginationMeta'
      '401':
        $ref: '#/components/responses/Unauthorized'

